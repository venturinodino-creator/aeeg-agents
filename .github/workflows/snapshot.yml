name: AEEG Agents snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the snapshot shaping
        run: node --test tests/*.test.mjs
      - name: Collect AEEG repo + agent data
        run: node scripts/snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data.json
        run: |
          git config user.name  "aeeg-agents-bot"
          git config user.email "aeeg-agents-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%FT%TZ) [skip ci]"
          git push
